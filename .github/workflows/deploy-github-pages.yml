# GitHub Pages only — builds and deploys this Vite app from GitHub Actions.
#
# One-time Pages setup (otherwise deploy-pages can return HTTP 404):
#   Repo → Settings → Pages → Build and deployment → Source: GitHub Actions
#
# API URL at build time (same idea as `.env.local` locally):
#   Repo → Settings → Secrets and variables → Actions → Variables
#   Name: VITE_API_BASE_URL   Value: your backend origin, no trailing slash, e.g. https://your-api.example.com
#   Vite embeds only vars prefixed with VITE_; they are visible in the published JS bundle (use HTTPS; avoid secrets).
#   Leave unset to use fallbacks in `src/services/api.js`.
#
# Docs: https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site#publishing-with-a-custom-github-actions-workflow
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and test
        run: |
          npm ci
          npm run lint
          npm run test:ci

      - name: Build for GitHub Pages
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
